name: Spring Boot CI/CD

on:
  push:
    branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]
  workflow_dispatch:


jobs:
  app-build-test:
    runs-on: ubuntu-latest

    steps:

      - name: CheckOut Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
            distribution: 'temurin'
            java-version: '21'

      - name: Build and Test
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
            name: test-reports
            path: docker/app1-hello/springboot/hello-spring/target/surefire-reports

  app-build-push:
    runs-on: ubuntu-latest
    needs: app-build-test

    steps:

      - name: CheckOut Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
            distribution: 'temurin'
            java-version: '21'

      - name: Build JAR for Docker
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with: 
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
            context: docker/app1-hello/springboot/hello-spring/
            push: true
            tags: ${{secrets.DOCKERHUB_USERNAME}}/hello-spring:latest
